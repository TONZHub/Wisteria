name: Android CI

on:
  workflow_dispatch: {}
  pull_request: {}
  push:
    branches:
      - main

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIREBASE_CONFIG_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
      MEMORY_SERVICE_URL: ${{ vars.MEMORY_SERVICE_URL }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Restore stable CI debug signing key
        uses: actions/cache@v5
        with:
          path: ~/.android/debug.keystore
          key: wisteria-ci-debug-keystore-v1

      - name: Ensure stable CI debug signing key
        run: |
          mkdir -p "$HOME/.android"
          if [[ ! -f "$HOME/.android/debug.keystore" ]]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            > "$RUNNER_TEMP/debug-signing-certificate.txt"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure optional Firebase demo build
        if: env.FIREBASE_CONFIG_B64 != ''
        run: printf '%s' "$FIREBASE_CONFIG_B64" | base64 --decode > app/google-services.json

      - name: Test and build debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Upload unit-test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wisteria-unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: warn
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: wisteria-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            ${{ runner.temp }}/debug-signing-certificate.txt
          if-no-files-found: error
          retention-days: 14

  memory-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: memory-service
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: memory-service/requirements-dev.txt

      - name: Install bridge dependencies
        run: pip install -r requirements-dev.txt

      - name: Test authentication, scoping, and filtering
        run: pytest -q

name: Android CI

on:
  workflow_dispatch: {}
  pull_request: {}
  push:
    branches:
      - main

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIREBASE_CONFIG_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
      MEMORY_SERVICE_URL: ${{ vars.MEMORY_SERVICE_URL }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Restore stable CI debug signing key
        uses: actions/cache@v5
        with:
          path: ~/.android/debug.keystore
          key: wisteria-ci-debug-keystore-v1

      - name: Ensure stable CI debug signing key
        run: |
          mkdir -p "$HOME/.android"
          if [[ ! -f "$HOME/.android/debug.keystore" ]]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            > "$RUNNER_TEMP/debug-signing-certificate.txt"
          {
            echo "### Debug signing certificate"
            grep -E 'SHA1:|SHA256:' "$RUNNER_TEMP/debug-signing-certificate.txt"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure optional Firebase demo build
        if: env.FIREBASE_CONFIG_B64 != ''
        run: printf '%s' "$FIREBASE_CONFIG_B64" | base64 --decode > app/google-services.json

      - name: Verify Firebase OAuth matches debug signing key
        if: env.FIREBASE_CONFIG_B64 != ''
        shell: bash
        run: |
          set -euo pipefail

          package_name="com.zoeb.wisteria"
          web_client_id="$(
            jq -r --arg package "$package_name" '
              [.client[]
                | select(.client_info.android_client_info.package_name == $package)
                | .oauth_client[]?
                | select(.client_type == 3)
                | .client_id][0] // empty
              ' app/google-services.json
          )"
          test -n "$web_client_id" || {
            echo "::error title=Firebase OAuth configuration missing::The Firebase config has no web OAuth client for $package_name."
            exit 1
          }

          signing_sha1="$(
            keytool -list -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              | sed -n 's/^[[:space:]]*SHA1: //p' \
              | head -n 1
          )"
          test -n "$signing_sha1" || {
            echo "::error title=Debug signing certificate unreadable::CI could not determine the APK signing SHA-1."
            exit 1
          }
          signing_hash="$(tr -d ':' <<< "$signing_sha1" | tr '[:upper:]' '[:lower:]')"

          registered_hashes="$(
            jq -r --arg package "$package_name" '
              .client[]
              | select(.client_info.android_client_info.package_name == $package)
              | .oauth_client[]?
              | select(.client_type == 1)
              | .android_info.certificate_hash // empty
            ' app/google-services.json \
              | tr '[:upper:]' '[:lower:]' \
              | tr -d ':'
          )"

          grep -Fxq "$signing_hash" <<< "$registered_hashes" || {
            echo "::error title=Firebase OAuth SHA-1 mismatch::This APK is signed with $signing_sha1, but that fingerprint is absent from the uploaded google-services.json. Add it to the Firebase Android app and refresh GOOGLE_SERVICES_JSON_B64."
            exit 1
          }

          {
            echo "### Firebase Google Sign-In configuration"
            echo "- Android package: \`$package_name\`"
            echo "- Debug signing SHA-1: \`$signing_sha1\`"
            echo "- Web OAuth client: configured"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test and build debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Prepare clean APK artifact
        run: |
          mkdir -p "$RUNNER_TEMP/wisteria-apk"
          cp app/build/outputs/apk/debug/app-debug.apk \
            "$RUNNER_TEMP/wisteria-apk/Wisteria-debug.apk"

      - name: Upload unit-test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wisteria-unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: warn
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: wisteria-debug-apk
          path: ${{ runner.temp }}/wisteria-apk/Wisteria-debug.apk
          if-no-files-found: error
          retention-days: 14

  memory-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: memory-service
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: memory-service/requirements-dev.txt

      - name: Install bridge dependencies
        run: pip install -r requirements-dev.txt

      - name: Test authentication, scoping, and filtering
        run: pytest -q
